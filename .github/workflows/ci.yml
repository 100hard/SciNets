name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest
        env:
          PYTHONPATH: .
          SCINETS_SECRET_KEY: test-ci-secret-key-12345
          OPENAI_API_KEY: test-ci-openai-key
        run: |
          pytest tests/ -v

  frontend:
    name: Frontend Tests (Vitest & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scinets-discovery-hub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Run Vitest
        run: npm test
