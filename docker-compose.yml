version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scinets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "8005:8005"
    environment:
      - SCINETS_DATABASE_URL=postgresql://user:password@postgres:5432/scinets
      - QDRANT_URL=http://qdrant:6333
      # Frontend URL for Magic Links
      - SCINETS_FRONTEND_URL=http://localhost:8080
      # Valid SMTP credentials are loaded from env_file below
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - qdrant

  frontend:
    build: ./scinets-discovery-hub
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
