[project]
name = "scinets-backend"
version = "0.1.0"
description = "Backend for SciNets V2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langchain-community",
    "pydantic>=2.6.0",
    "httpx>=0.26.0",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "biopython",
    "rdkit",
    "sympy",
    "networkx",
    "duckduckgo-search"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
